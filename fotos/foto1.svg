<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#d62246"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="450" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Patrón de cuadrícula médica de fondo -->
  <g opacity="0.1" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Línea de ECG de fondo -->
  <path d="M 0 320 L 150 320 L 170 290 L 190 350 L 215 240 L 240 370 L 265 320 L 600 320" 
        fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.35" stroke-dasharray="8 4"/>

  <!-- Placa / Marco superior -->
  <rect x="180" y="30" width="240" height="38" rx="19" fill="#00f2fe" opacity="0.15"/>
  <text x="300" y="55" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#4facfe" text-anchor="middle" letter-spacing="2">
    CONSULTORIO 101 • FOTO 1
  </text>

  <!-- Ilustración central: Corazón latiendo con estetoscopio -->
  <g transform="translate(300, 195)">
    <!-- Aura de luz -->
    <circle cx="0" cy="0" r="95" fill="#ff4b72" opacity="0.15" filter="url(#glow1)"/>
    
    <!-- Corazón 3D -->
    <path d="M 0 65 
             C -80 0 -95 -55 -45 -85 
             C 0 -105 0 -45 0 -45 
             C 0 -45 0 -105 45 -85 
             C 95 -55 80 0 0 65 Z" 
          fill="url(#heartGrad)" filter="url(#glow1)"/>
          
    <!-- Brillo en el corazón -->
    <path d="M -30 -65 C -15 -80 15 -75 25 -55" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Gorrito de cumpleaños en el corazón -->
    <g transform="translate(15, -95) rotate(15)">
      <polygon points="0,0 -20,45 20,45" fill="#ffd166"/>
      <polygon points="-5,15 -18,45 -5,45" fill="#ff9f1c"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
      <circle cx="-5" cy="30" r="3" fill="#ffffff"/>
      <circle cx="8" cy="38" r="3" fill="#ffffff"/>
    </g>

    <!-- Estetoscopio rodeando -->
    <path d="M -70 20 C -90 100 90 100 70 20" fill="none" stroke="#ffd166" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="18" r="14" fill="#ffd166"/>
    <circle cx="70" cy="18" r="8" fill="#2c5364"/>
  </g>

  <!-- Texto informativo para sustitución -->
  <text x="300" y="380" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    ¡Espacio para la Foto Especial de Armando! 📸
  </text>
  <text x="300" y="410" font-family="'Montserrat', sans-serif" font-size="13" fill="#a0c4d8" text-anchor="middle">
    Puedes colocar tu foto real nombrándola foto1.jpg en la carpeta fotos
  </text>
</svg>
