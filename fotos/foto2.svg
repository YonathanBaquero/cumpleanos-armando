<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#243B55"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad2)"/>

  <!-- Placa superior -->
  <rect x="180" y="30" width="240" height="38" rx="19" fill="#00c6ff" opacity="0.15"/>
  <text x="300" y="55" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#00c6ff" text-anchor="middle" letter-spacing="2">
    CONSULTORIO 102 • FOTO 2
  </text>

  <!-- Ilustración central: Bata de médico / tarjeta de identificación con confeti -->
  <g transform="translate(300, 200)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="95" fill="#00c6ff" opacity="0.15" filter="url(#glow2)"/>

    <!-- Bata blanca médica -->
    <path d="M -70 80 L -80 -40 L -30 -60 L 0 -10 L 30 -60 L 80 -40 L 70 80 Z" fill="#ffffff" filter="url(#glow2)"/>
    <path d="M -30 -60 L 0 50 L 30 -60" fill="#e2e8f0"/>
    <!-- Corbata o camisa festiva debajo -->
    <polygon points="0,-10 -12,40 0,65 12,40" fill="#ff4d6d"/>
    
    <!-- Cuello de la bata -->
    <path d="M -80 -40 L -25 20 L -30 -60 Z" fill="#f8fafc"/>
    <path d="M 80 -40 L 25 20 L 30 -60 Z" fill="#f8fafc"/>

    <!-- Credencial del Dr. Armando -->
    <rect x="-45" y="-10" width="38" height="48" rx="4" fill="#0072ff"/>
    <rect x="-42" y="-7" width="32" height="22" rx="2" fill="#ffffff"/>
    <circle cx="-26" cy="3" r="6" fill="#0072ff"/>
    <rect x="-40" y="20" width="28" height="3" fill="#ffffff"/>
    <rect x="-40" y="26" width="20" height="3" fill="#ffffff"/>

    <!-- Estrellas y confeti alrededor -->
    <text x="70" y="-30" font-size="28">✨</text>
    <text x="-90" y="10" font-size="26">🎉</text>
    <text x="60" y="60" font-size="24">🎈</text>
  </g>

  <!-- Texto informativo -->
  <text x="300" y="380" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    ¡Segunda Foto de Celebración! 📸
  </text>
  <text x="300" y="410" font-family="'Montserrat', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Nombra tu imagen foto2.jpg en la carpeta fotos para reemplazar este diseño
  </text>
</svg>
