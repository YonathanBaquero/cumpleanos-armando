<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#003554"/>
      <stop offset="100%" stop-color="#006494"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff99c8"/>
      <stop offset="100%" stop-color="#fcf6bd"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad5)"/>

  <!-- Placa superior -->
  <rect x="180" y="30" width="240" height="38" rx="19" fill="#00f2fe" opacity="0.15"/>
  <text x="300" y="55" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="2">
    CONSULTORIO 105 • FOTO 5
  </text>

  <!-- Ilustración central: Pastel de cumpleaños con píldoras de felicidad y velas -->
  <g transform="translate(300, 205)">
    <!-- Aura de luz -->
    <circle cx="0" cy="0" r="95" fill="#00f2fe" opacity="0.15" filter="url(#glow5)"/>

    <!-- Plato del pastel -->
    <ellipse cx="0" cy="80" rx="100" ry="20" fill="#cbd5e1" opacity="0.8"/>
    
    <!-- Base del pastel -->
    <path d="M -75 25 C -75 50 75 50 75 25 L 75 75 C 75 95 -75 95 -75 75 Z" fill="#ff70a6" filter="url(#glow5)"/>
    <ellipse cx="0" cy="25" rx="75" ry="20" fill="#ff99c8"/>
    
    <!-- Segundo piso del pastel -->
    <path d="M -50 -15 C -50 5 50 5 50 -15 L 50 25 C 50 45 -50 45 -50 25 Z" fill="#48cae4"/>
    <ellipse cx="0" cy="-15" rx="50" ry="14" fill="#90e0ef"/>

    <!-- Velas encendidas -->
    <g transform="translate(-25, -55)">
      <rect x="0" y="10" width="6" height="30" rx="2" fill="#ffd166"/>
      <ellipse cx="3" cy="5" rx="5" ry="10" fill="#ff5400" filter="url(#glow5)"/>
      <ellipse cx="3" cy="6" rx="2.5" ry="6" fill="#ffff3f"/>
    </g>
    <g transform="translate(0, -62)">
      <rect x="0" y="10" width="6" height="36" rx="2" fill="#06d6a0"/>
      <ellipse cx="3" cy="4" rx="6" ry="11" fill="#ff5400" filter="url(#glow5)"/>
      <ellipse cx="3" cy="5" rx="3" ry="7" fill="#ffff3f"/>
    </g>
    <g transform="translate(25, -55)">
      <rect x="0" y="10" width="6" height="30" rx="2" fill="#118ab2"/>
      <ellipse cx="3" cy="5" rx="5" ry="10" fill="#ff5400" filter="url(#glow5)"/>
      <ellipse cx="3" cy="6" rx="2.5" ry="6" fill="#ffff3f"/>
    </g>

    <!-- Píldoras de felicidad flotando como chispas -->
    <g transform="translate(-75, -20) rotate(-25)">
      <rect x="0" y="0" width="14" height="28" rx="7" fill="#ff4d6d"/>
      <rect x="0" y="14" width="14" height="14" rx="0" fill="#ffffff"/>
    </g>
    <g transform="translate(75, -15) rotate(35)">
      <rect x="0" y="0" width="14" height="28" rx="7" fill="#ffd166"/>
      <rect x="0" y="14" width="14" height="14" rx="0" fill="#06d6a0"/>
    </g>
  </g>

  <!-- Texto informativo -->
  <text x="300" y="380" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    ¡Quinta Foto: Pide un Deseo! 🎂
  </text>
  <text x="300" y="410" font-family="'Montserrat', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    Nombra tu imagen foto5.jpg en la carpeta fotos para reemplazar este diseño
  </text>
</svg>
